# Local development database. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: launchpad-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchpad
    ports:
      - "5487:5432"
    volumes:
      - launchpad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d launchpad"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  launchpad-db-data:
